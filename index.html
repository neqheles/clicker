<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
    </div>

    <div class="music-button" id="musicBtn">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
        </svg>
    </div>

    <div class="container">
        <div class="score-container">
            <h1 class="score" id="score">0</h1>
            <p class="score-label">кликов</p>
            <p class="clicks-per-second">Кликов в секунду: <span id="cps">0</span></p>
        </div>

        <div class="clicker-container">
            <div class="click-effect" id="clickEffect"></div>
            <img src="photo_2026-04-14_11-04-23.jpg" alt="Avatar" class="avatar" id="avatar">
            <div class="glow-ring"></div>
        </div>

        <div class="upgrades">
            <h2>Улучшения</h2>
            <div class="upgrade-item" id="upgrade1">
                <div class="upgrade-info">
                    <span class="upgrade-name">Автокликер</span>
                    <span class="upgrade-desc">+1 клик/сек</span>
                </div>
                <div class="upgrade-cost">
                    <span id="cost1">10</span> 💎
                </div>
            </div>
            <div class="upgrade-item" id="upgrade2">
                <div class="upgrade-info">
                    <span class="upgrade-name">Мега кликер</span>
                    <span class="upgrade-desc">+5 кликов/сек</span>
                </div>
                <div class="upgrade-cost">
                    <span id="cost2">50</span> 💎
                </div>
            </div>
            <div class="upgrade-item" id="upgrade3">
                <div class="upgrade-info">
                    <span class="upgrade-name">Ультра кликер</span>
                    <span class="upgrade-desc">+20 кликов/сек</span>
                </div>
                <div class="upgrade-cost">
                    <span id="cost3">200</span> 💎
                </div>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="Skaner_Wakacyjny_Romans_Bass_Boosted_instrumental_moje_ohv_chce.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
